<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huddle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script>
  // Theme: follows the system unless you've picked the other one with the sun/moon button (remembered).
  // Resolved into <html data-theme> here, before the page paints, so there's no flash.
  (function () {
    var pick = null, mq = matchMedia('(prefers-color-scheme: dark)');
    try { pick = JSON.parse(localStorage.getItem('randompin.theme')); } catch (e) {}
    window.applyTheme = function (p) {
      pick = p;
      document.documentElement.dataset.theme = p === 'light' || p === 'dark' ? p : mq.matches ? 'dark' : 'light';
    };
    mq.addEventListener('change', function () { applyTheme(pick); });
    applyTheme(pick);
  })();
</script>
<style>
  /* ===== Huddle styles =====
     1. tokens (colours, shadows, type, shape; light and dark)   2. base
     3. components: buttons, segmented switches, fields, cards, lists, avatars
     4. regions: panel, room box and pick, time, chat, map, floating boxes, tutorial
     5. layouts: desktop (over 960px), stacked (960px and under), phones (600px and under), in between,
        touch screens
     Components are classes (.btn, .seg, .field, .inline-edit, .float, .list); regions only place
     and size them. To change how something looks everywhere, change the component. */

  /* ---------- 1. tokens ---------- */
  :root {
    color-scheme: light;
    /* surfaces, back to front: canvas (behind the map and calendar) < panel (--bg) < cards and controls
       (--card, or --surf: the same, lit from above) < floating boxes. --inset: recessed (the lists'
       well, switch tracks); --hover: a control under the pointer */
    --canvas: #e8ebf0; --bg: #f2f4f7; --card: #fff; --surf: linear-gradient(180deg, #fff, #f8f9fb);
    --inset: #e9ecf1; --hover: #f5f6f9; --chat: #f9fafb;
    --fg: #1b2030; --mut: #5e6677; --line: #e1e4ea; --line-strong: #c9ced8;
    /* shadows: a control at rest, a raised card, a card lifted on hover, a field's inner edge, a floating box */
    --sh-1: 0 1px 2px rgba(16, 24, 40, .06);
    --sh-2: 0 1px 2px rgba(16, 24, 40, .08), 0 3px 8px rgba(16, 24, 40, .1);
    --sh-3: 0 2px 4px rgba(16, 24, 40, .08), 0 8px 18px rgba(16, 24, 40, .14);
    --sh-in: inset 0 1px 1px rgba(16, 24, 40, .05);
    --sh-float: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 18px rgba(16, 24, 40, .1);
    --sh-edge: rgba(16, 24, 40, .14);   /* a scrolling box's edge, where there's more to see */
    /* colours: red for actions and selection; slate blue marks the chat, green what's decided */
    --acc: #d93025; --acc-grad: linear-gradient(180deg, #df3a2f, #cc2a1f); --acc-glow: rgba(217, 48, 37, .22);
    --acc2: #3d5a94; --ok: #15803d; --warn: #c2410c;
    --hl: #d97706; --hl-glow: rgba(217, 119, 6, .35);   /* the tutorial's highlight: must not look like the accent */
    /* the calendar: one person free / two or more / everyone, the numbers on them, and your own outline */
    --t-one: #d3dcea; --t-some: #fcc93a; --t-all: #4fd282; --t-text: #1d2433; --t-mine: rgba(0, 0, 0, .6);
    /* type and shape */
    --fs-xs: 11px; --fs-s: 12px; --fs-m: 13px;
    --r-s: 6px; --r: 8px; --r-l: 10px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #090b0f; --bg: #12151c; --card: #1a1f29; --surf: linear-gradient(180deg, #202634, #1a1f29);
    --inset: #0c0f14; --hover: #222937; --chat: #0f1218;
    --fg: #e8eaf0; --mut: #9aa3b4; --line: #262c38; --line-strong: #39414f;
    --sh-1: 0 1px 2px rgba(0, 0, 0, .4);
    --sh-2: 0 1px 2px rgba(0, 0, 0, .5), 0 4px 10px rgba(0, 0, 0, .4);
    --sh-3: 0 2px 4px rgba(0, 0, 0, .5), 0 10px 22px rgba(0, 0, 0, .5);
    --sh-in: inset 0 1px 2px rgba(0, 0, 0, .35);
    --sh-float: 0 2px 4px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .45);
    --sh-edge: rgba(0, 0, 0, .5);
    --acc: #ff6b5e; --acc-grad: linear-gradient(180deg, #e2493e, #cc3a30); --acc-glow: rgba(217, 68, 58, .22);
    --acc2: #93abdb; --ok: #4ade80; --warn: #fb923c;
    --hl: #fbbf24; --hl-glow: rgba(251, 191, 36, .4);
    --t-one: #384457; --t-some: #e0a42e; --t-all: #3cbf6c; --t-text: #14171c; --t-mine: rgba(255, 255, 255, .7);
  }

  /* ---------- 2. base ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--canvas); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  :is(button, a, [role="button"]):focus-visible { outline: 2px solid color-mix(in srgb, var(--acc) 60%, transparent); outline-offset: 2px; }
  ::placeholder { color: var(--mut); opacity: .85; font-size: var(--fs-s); font-weight: 400; }
  h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  /* the huddle's name: looks like the heading until hovered (empty, it shows "Huddle") */
  h1 .inline-edit { width: auto; max-width: 100%; margin-left: -6px; padding: 0 5px; font: inherit; letter-spacing: inherit; text-overflow: ellipsis; }
  h1 .inline-edit::placeholder { color: var(--fg); font-size: inherit; font-weight: inherit; opacity: 1; }
  .h1row h1 { min-width: 0; }

  /* Avatars: a person's identicon in a ring of their colour (the pins draw their own, see the map). */
  .face { position: relative; flex: none; width: 18px; height: 18px; overflow: hidden; border: 2px solid; border-radius: 50%; background: #fff; }
  .face svg { width: 20px; height: 20px; }
  .av svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }   /* centred, so any clipping is even */

  /* ---------- 4. regions ---------- */

  /* fixed + inset follows the *visible* viewport, so mobile browser chrome can't push the layout off-screen */
  #app { position: fixed; inset: 0; display: flex; }
  #map { flex: 1; min-width: 0; background: var(--card); }
  body.view-time #map { display: none; }

  /* The panel: the controls (header) and the lists scroll together; the chat sits under them. */
  #panel { position: relative; z-index: 1; width: 360px; min-height: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line-strong); background: var(--bg); }
  #fold { display: none; }   /* stacked layouts only */
  #scroller { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; background: var(--inset); }   /* the controls, then the list box, which fills the rest and scrolls itself */
  #scroller > header { flex: none; padding: 12px 16px 0; }   /* on the same well as the list, so the list box is what stands out */
  .h1row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #theme { margin-right: auto; }   /* Space | Time goes to the right */
  #views { display: none; }   /* desktop only; the stacked layouts have tabs */
  .droprow { display: flex; gap: 6px; }
  .droprow > .btn.primary { flex: 1; min-width: 0; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tools > .btn { flex: 1 1 auto; }
  .droprow > .tools { flex: 1; min-width: 0; margin-top: 0; }   /* Time: its buttons share the first row with the link button */
  /* each view shows its own buttons (.sp: Space, .tm: Time) and its own list */
  .tm { display: none !important; }
  body.view-time .tm { display: flex !important; }
  body.view-time .sp { display: none !important; }
  #list .lbl { font-weight: 600; }
  #list .mine { cursor: text; }
  #list .mine:hover { text-decoration: underline dotted; }
  #list li.latest .num { background: var(--acc-grad); color: #fff; }
  #list li.owned .num { background: var(--pc); color: #fff; }

  /* The room box: status, people, and the pick. */
  #room { position: relative; margin-top: 10px; font-size: var(--fs-m); }
  .rowline { display: flex; align-items: center; gap: 8px; }
  .rowline .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--mut); }
  .dot.live { background: var(--ok); }
  .dot.reconnecting, .dot.connecting { background: var(--warn); }
  .dot.offline { background: var(--acc); }
  #onlinebtn { white-space: nowrap; }
  /* "N online ▾": the room's people, online first, then those who've been here */
  #members { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; right: 0; max-height: 260px; overflow-y: auto; padding: 4px 0; }
  #chatform #members { top: auto; bottom: calc(100% + 4px); left: 8px; right: 8px; }   /* opened from the chat: above its message box */
  /* while it's open, the rest of its pane (the controls and lists, or the chat) is dimmed and out of reach;
     a click there closes it */
  #scroller, #chat { position: relative; }
  #scrim { position: absolute; inset: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 60%, transparent); backdrop-filter: blur(1px); }
  #members h4 { margin: 6px 10px 2px; color: var(--mut); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  #members .m { display: flex; align-items: center; gap: 8px; padding: 4px 10px; }
  #members .m.off { opacity: .55; }
  #members .m.can { cursor: pointer; }
  #members .m.can:hover { background: var(--hover); }
  #members .alone { padding: 4px 10px; color: var(--mut); font-size: var(--fs-s); }
  #roomhelp { margin: 8px 0 0; color: var(--acc); font-size: var(--fs-s); }
  #roomhelp code { font-size: var(--fs-xs); }
  #live { margin: 8px 0 0; color: var(--mut); font-size: var(--fs-s); }
  #live:empty { display: none; }

  /* Time: a calendar of days × hours (the main area) everyone paints their free hours on. A day is one
     continuous column; back-to-back hours in the same state join into one block, rounded at its ends,
     and your own hours get one outline per run. The day and hour labels stay put while it scrolls; touch
     scrolls it (painting on touch starts with a press-and-hold, see the code). */
  #time { flex: 1; min-width: 0; overflow: auto; padding: 0 12px 16px 0; background: var(--canvas); }
  #tgrid { --rowh: 22px; width: max-content; min-width: 100%; display: grid; column-gap: 4px; row-gap: 0; user-select: none; -webkit-user-select: none; touch-action: pan-x pan-y; }
  #tgrid .dh, #tgrid .hh, #tgrid > div:first-child { background: var(--canvas); }
  #tgrid .dh { position: sticky; top: 0; z-index: 2; padding: 10px 0 4px; color: var(--mut); font-size: var(--fs-s); font-weight: 600; text-align: center; white-space: nowrap; }
  #tgrid .hh { position: sticky; left: 0; z-index: 1; padding: 0 6px 0 12px; color: var(--mut); font-size: var(--fs-xs); line-height: var(--rowh); text-align: right; font-variant-numeric: tabular-nums; }
  #tgrid > div:first-child { position: sticky; left: 0; top: 0; z-index: 3; }
  #tgrid .c { position: relative; height: var(--rowh); background: var(--card); color: var(--t-text); font-size: 10px; font-weight: 600; line-height: var(--rowh); text-align: center; cursor: pointer; }
  #tgrid .c.nofree { background-image: linear-gradient(rgba(127, 127, 127, .14) 1px, transparent 1px); }   /* faint hour lines */
  #tgrid .c.one { background: var(--t-one); }
  #tgrid .c.some { background: var(--t-some); }
  #tgrid .c.all { background: var(--t-all); }
  #tgrid .c:is(.first, .runtop) { border-top-left-radius: var(--r-s); border-top-right-radius: var(--r-s); }
  #tgrid .c:is(.last, .runend) { border-bottom-left-radius: var(--r-s); border-bottom-right-radius: var(--r-s); }
  /* your own hours: a thin outline around each run of them, kept under the other marks (--mine is
     reused by the most-voted hour's glow) */
  #tgrid .c.mine { --mine: inset 1.5px 0 var(--t-mine), inset -1.5px 0 var(--t-mine); box-shadow: var(--mine); }
  #tgrid .c.mine.mtop { --mine: inset 1.5px 0 var(--t-mine), inset -1.5px 0 var(--t-mine), inset 0 1.5px var(--t-mine); }
  #tgrid .c.mine.mend { --mine: inset 1.5px 0 var(--t-mine), inset -1.5px 0 var(--t-mine), inset 0 -1.5px var(--t-mine); }
  #tgrid .c.mine.mtop.mend { --mine: inset 0 0 0 1.5px var(--t-mine); }
  #tgrid .c.sel { z-index: 1; outline: 2px dashed var(--mut); outline-offset: 1px; }
  #tgrid .c.top { z-index: 1; outline: 2px solid var(--acc); outline-offset: 1px; box-shadow: var(--mine, 0 0 transparent), 0 0 0 4px color-mix(in srgb, var(--acc) 25%, transparent); }
  #tgrid .c.lim { z-index: 1; outline: 2px dashed var(--acc); outline-offset: -1px; background-color: color-mix(in srgb, var(--acc) 12%, var(--card)); }
  #tgrid.inactive .c { cursor: default; }
  #tgrid.limiting .c { cursor: crosshair; }
  /* the Time view's part of the panel: who's answered how, the list, and the colour key */
  #tside { display: none; font-size: var(--fs-m); }
  body.view-time #tside { flex: 1 1 0; display: flex; flex-direction: column; }
  #tpeople { margin: 0; padding: 8px 16px 0; color: var(--mut); font-size: var(--fs-s); }
  #tpeople:empty { display: none; }
  .tkey { flex: none; display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 16px 12px; color: var(--mut); font-size: var(--fs-xs); }
  .tkey span { display: inline-flex; align-items: center; gap: 4px; }
  .tkey i { width: 12px; height: 12px; display: inline-block; border-radius: 3px; }
  .tkey .k0 { border: 1px solid var(--line); background: var(--card); }
  .tkey .k1 { background: var(--t-one); }
  .tkey .k2 { background: var(--t-some); }
  .tkey .ka { background: var(--t-all); }
  .tkey .kt { border: 2px solid var(--acc); }
  #ttz:empty { display: none; }

  /* The chat: an IRC-style log, sized for a narrow panel. */
  #chat { flex: 1; min-height: 90px; display: flex; flex-direction: column; background: var(--chat); }
  .chatbar { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 4px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--acc2) 10%, var(--card)), color-mix(in srgb, var(--acc2) 5%, var(--card))); color: var(--acc2); font-size: var(--fs-s); font-weight: 700; }
  .chatbar .rt { order: -1; display: flex; align-items: center; gap: 8px; }   /* controls on the left, your name on the right */
  /* the grip in the middle; your name hugging the right edge, sized to it (see fitName) and never
     reaching the grip ("…" if it's that long) */
  .chatbar .gface { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .chatbar #mebox { display: flex; justify-content: flex-end; min-width: 0; max-width: calc(50% - 44px); }
  .chatbar .me .inline-edit { width: auto; min-width: 0; text-align: right; text-overflow: ellipsis; }
  #mute { padding: 0 2px; border: 0; background: none; font-size: var(--fs-m); line-height: 1; opacity: .85; }
  #mute:hover { opacity: 1; }
  /* you: avatar and your name, editable in place */
  .me { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .me .inline-edit { width: 12ch; padding: 1px 5px; font-size: var(--fs-s); }
  /* "<nick> text", wrapped lines indented a little */
  #msgs { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 6px 0; list-style: none; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #msgs li { padding: 0 8px 0 calc(8px + 2ch); text-indent: -2ch; overflow-wrap: anywhere; }
  #msgs li.sys { color: var(--mut); }
  #msgs li.mention { background: color-mix(in srgb, var(--acc) 12%, transparent); box-shadow: inset 3px 0 var(--acc); }
  #msgs .pinref { font: inherit; font-weight: 700; }
  /* nicks in the person's colour; on the dark theme lightened, so dark colours (navy, near-black) stay readable */
  .nick { color: var(--pc, var(--fg)); font-weight: 700; }
  :root[data-theme="dark"] .nick { color: color-mix(in srgb, var(--pc, #fff) 55%, #fff); }
  .nick.can { cursor: pointer; }
  .nick.can:hover { text-decoration: underline; }
  .at { color: var(--acc); font-weight: 700; }
  .at.me { padding: 0 2px; border-radius: 3px; background: color-mix(in srgb, var(--acc) 22%, transparent); }
  .pinref { padding: 0; border: 0; background: none; color: var(--acc); font-weight: 600; text-decoration: underline; }
  .pinref .pedit { display: inline-block; margin-left: 3px; text-decoration: none; opacity: .75; }   /* your own pins: edit the label */
  #chatform { position: relative; display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--bg); }
  #chatform .field { flex: 1; }
  #peoplebtn { flex: none; gap: 4px; padding: 0 8px; color: var(--mut); font-variant-numeric: tabular-nums; }
  #peoplebtn svg { width: 15px; height: 15px; }
  #tabs { display: none; }   /* stacked layouts only */
  body:not(.inroom) :is(#chat, #tabs) { display: none; }

  /* The map: drawing and placing cursors, the Google base map, Leaflet's controls, and the pins. */
  #map.drawing, #map.drawing .leaflet-interactive { cursor: crosshair !important; touch-action: none !important; }
  #map.placing, #map.placing .leaflet-interactive, #map.placing .leaflet-marker-icon { cursor: crosshair !important; }
  .leaflet-google-pane iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; transition: opacity .2s; }   /* fades in */
  .leaflet-zoom-anim .leaflet-google-pane iframe { transition: transform .25s cubic-bezier(0, 0, .25, 1), opacity .2s; }   /* follows Leaflet's zoom */
  .leaflet-bar { overflow: hidden; border: 1px solid rgba(0, 0, 0, .15) !important; border-radius: var(--r) !important; box-shadow: 0 1px 4px rgba(0, 0, 0, .15) !important; }
  .resetc a { font-size: 17px; }
  .basesw a { font-family: system-ui, sans-serif; font-weight: 700; letter-spacing: -.02em; }   /* shows the map it switches to */
  .basesw a.google { font-size: 15px; color: #4285f4; }
  .basesw a.osm { font-size: 9px; color: #3a7d2c; }
  /* Box / Freehand (a .seg), over the map while drawing an area */
  #shapesw { position: absolute; z-index: 1000; top: 10px; left: 50%; transform: translateX(-50%); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
  /* Pins: a teardrop rotated so the tip is at the bottom centre; a saturated fill (purple when nobody's
     colour applies), a thin dark line, a white ring and a faint outer edge, so they read on light and
     dark map areas alike. */
  .pin-icon { border: 0; background: none; }
  .pin-icon .pin { width: 24px; height: 24px; margin: 3px; display: grid; place-items: center; border: 1.5px solid rgba(0, 0, 0, .85); border-radius: 50% 50% 50% 0; background: var(--pc, #8e24aa); transform: rotate(-45deg); box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0, 0, 0, .35), 0 3px 8px rgba(0, 0, 0, .45); }
  .pin-icon.latest .pin { transform: rotate(-45deg) scale(1.2); box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px rgba(0, 0, 0, .6), 0 3px 10px rgba(0, 0, 0, .55); }
  .pin-icon.latest:not(.owned) .pin { background: var(--acc); }
  .pin-icon .size.neg .pin { border-color: rgba(0, 0, 0, .35); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }   /* downvoted: no emphasis */
  /* the avatar: the identicon's 5×5 grid sits in an 8×8 viewBox, so drawing it larger than its circle lets
     the grid fill it; the corners get clipped, which still leaves each one distinct */
  .pin-icon .pin .av { position: relative; width: 20px; height: 20px; overflow: hidden; border-radius: 50%; background: #fff; transform: rotate(45deg); }
  .pin-icon .pin .av svg { width: 28px; height: 28px; }
  .pin-icon .pin span { color: #fff; font: 700 12px/1 system-ui, sans-serif; text-shadow: 0 0 2px rgba(0, 0, 0, .5); transform: rotate(45deg); }
  /* more votes = bigger, scaled about the tip so the pin stays on its spot; the score on its head is
     counter-scaled in the code so it stays readable */
  .pin-icon .size { position: relative; transform-origin: 15px 32px; transition: transform .25s ease, opacity .25s ease; }
  .pin-icon .vb { position: absolute; left: 19px; top: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #1e8e3e; color: #fff; font: 700 10px/17px system-ui, sans-serif; text-align: center; transform-origin: 0 100%; box-shadow: 0 0 0 1.5px #fff, 0 1px 3px rgba(0, 0, 0, .4); }
  .pin-icon .vb.down { background: #5f6368; }
  /* a pin's label, under its tip: about 7 characters (the full label is in the list) */
  .leaflet-tooltip.pin-tag { max-width: calc(7ch + 12px); overflow: hidden; padding: 0 6px; border: 0; border-radius: 4px; background: rgba(255, 255, 255, .92); color: #1a1a1a; font: 600 13px/19px system-ui, sans-serif; text-overflow: ellipsis; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
  .leaflet-tooltip.pin-tag::before { display: none; }
  /* a merge: a ghost of the placed pin slides into the one it joined */
  .ghost { position: absolute; z-index: 650; width: 18px; height: 18px; border: 2px solid #fff; border-radius: 50% 50% 50% 0; background: var(--pc); rotate: -45deg; pointer-events: none; box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }

  /* Floating boxes (.float): the selected pin's card, toasts. */
  #detail { position: absolute; z-index: 1000; left: 8px; bottom: 26px; max-width: calc(100% - 16px); padding: 6px 10px 8px; font-size: var(--fs-s); line-height: 1.35; cursor: default; }
  #detail .dhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 600; }
  #detail .dhead span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #detail .x { padding: 0 2px; border: 0; background: none; color: var(--mut); font-size: 17px; line-height: 1; }
  #detail .x:hover { color: var(--fg); }
  #detail .dcoords { color: var(--mut); font-variant-numeric: tabular-nums; }
  #detail .links { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
  #detail .lk { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

/* ---------- state ---------- */

// Pin: {id, n, lat, lng, ts, by (cid), votes: {cid: 1|-1}}

/* ---------- share URL: #[room=id&]map=lat/lng/zoom[&area=lat,lng_lat,lng_…] (older links: &rect=s,w,n,e) ---------- */

const num = (s) => (s !== '' && s != null && Number.isFinite(+s) ? +s : NaN);

  if (a.length >= 3 && a.every((pt) => pt.length === 2 && pt.every(Number.isFinite))) area = a;

const r5 = (x) => +x.toFixed(5);

/* ---------- map ---------- */

const map = L.map('map', { zoomControl: true, minZoom: 2, maxZoom: 19, zoomSnap: 0.25 });

{ const f = store.get(K.fold, 'open'); setFold(f === true ? 'folded' : f); }   // (an older version stored true/false)

// The limit area: a freehand shape, [[lat, lng], …] with unwrapped longitudes (see server.js).

const AREA_STYLE = { color: '#d93025', weight: 2, dashArray: '6 4', fill: false, interactive: false };
const SHADE_STYLE = { stroke: false, fillColor: '#000', fillOpacity: 0.22, interactive: false };

let areaLayer = null;

const areaArr = () => (areaLayer ? areaLayer.getLatLngs()[0].map((ll) => [ll.lat, ll.lng]) : null);

let initialFit = null;
const hash = parseHash();
{
  const view = hash.view || (hash.area ? null : store.get(K.view, null));
  if (view) map.setView(view.center, view.zoom);
  else {
    initialFit = hash.area ? () => map.fitBounds(L.polygon(hash.area).getBounds().pad(0.15)) : () => map.fitBounds(DHAKA);
    initialFit();
  }
}
const fitSize = map.getSize();
// A mis-sized first paint can leave a wrong zoom; refit once if the container changed size.
window.addEventListener('load', () => {
  map.invalidateSize();
  if (initialFit && !map.getSize().equals(fitSize)) initialFit();
}, { once: true });

map.on('moveend', () => {
  const c = map.getCenter();
  store.set(K.view, { center: [c.lat, c.lng], zoom: map.getZoom() });
  updateUrl();
});
window.addEventListener('hashchange', () => {
  const h = parseHash();
  if (h.room && h.room !== roomId) connect(h.room);   // a link without a room just keeps this one
  if (h.view) map.setView(h.view.center, h.view.zoom);
});

// Reset: a map button (under the zoom buttons and map switch) back to the default view.
const ResetControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const box = L.DomUtil.create('div', 'leaflet-bar resetc');
    const a = L.DomUtil.create('a', '', box);
    Object.assign(a, { href: '#', textContent: '⟲', title: 'Reset view' });
    a.setAttribute('role', 'button');
    a.setAttribute('aria-label', 'Reset view');
    L.DomEvent.on(a, 'click', (e) => { L.DomEvent.preventDefault(e); map.fitBounds(DHAKA); });
    L.DomEvent.disableClickPropagation(box);
    return box;
  },
});

/* ---------- draw an area ---------- */

const cont = map.getContainer();
let drawMode = false, drag = null;   // drag: {id, pts: container points, layer}

// Two shapes: a box (drag corner to corner, the default) or freehand (trace the outline). While
// drawing, a switch over the map picks between them, the same with mouse or touch; the choice sticks.
let drawShape = store.get(K.shape, 'box') === 'free' ? 'free' : 'box';
const shapeSwitch = el('div', { id: 'shapesw', className: 'seg', hidden: true, role: 'group' });
shapeSwitch.setAttribute('aria-label', 'Area shape');
for (const [k, label] of [['box', '▭ Box'], ['free', '✎ Freehand']]) {
  const b = el('button', { type: 'button' }, label);
  b.dataset.k = k;
  b.addEventListener('click', () => { drawShape = k; store.set(K.shape, k); setDrawMode(true); });
  shapeSwitch.append(b);
}
cont.append(shapeSwitch);
L.DomEvent.disableClickPropagation(shapeSwitch);

function setDrawMode(on) {
  if (on && placeMode) setPlaceMode(false);
  drawMode = on;
  cont.classList.toggle('drawing', on);
  shapeSwitch.hidden = !on;
  for (const b of shapeSwitch.children) b.setAttribute('aria-pressed', String(b.dataset.k === drawShape));
  $('draw').setAttribute('aria-pressed', String(on));
  $('draw').textContent = !on ? (areaLayer ? 'Area limited ×' : 'Limit area') : drawShape === 'box' ? 'Drag a box… (Esc)' : 'Draw a shape… (Esc)';
  for (const h of ['dragging', 'touchZoom', 'doubleClickZoom', 'boxZoom']) map[h][on ? 'disable' : 'enable']();
  if (!on && drag) { drag.layer.remove(); drag = null; }
}

// A box's four corners from two opposite container points (edges follow the map's grid).
const boxPts = (a, b) => [a, L.point(b.x, a.y), b, L.point(a.x, b.y)];

const clampLat = (ll) => L.latLng(Math.max(-85, Math.min(85, ll.lat)), ll.lng);

cont.addEventListener('pointerdown', (e) => {
  if (!drawMode || e.button !== 0 || e.target.closest('.leaflet-control, #detail, #toasts, #tut, #shapesw')) return;
  e.preventDefault(); e.stopPropagation();
  cont.setPointerCapture(e.pointerId);
  const pt = map.mouseEventToContainerPoint(e);
  drag = { id: e.pointerId, pts: [pt], layer: L.polygon([clampLat(map.containerPointToLatLng(pt))], { ...AREA_STYLE, dashArray: null }).addTo(map) };
}, true);

// Box: the drag's start and current point are opposite corners. Freehand: one stroke traces the
// outline, and the shape closes itself on release.
cont.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const pt = map.mouseEventToContainerPoint(e);
  if (drawShape === 'box') {
    drag.pts = [drag.pts[0], pt];
    drag.layer.setLatLngs(boxPts(drag.pts[0], pt).map((q) => clampLat(map.containerPointToLatLng(q))));
    return;
  }
  if (pt.distanceTo(drag.pts.at(-1)) < 4) return;
  drag.pts.push(pt);
  drag.layer.addLatLng(clampLat(map.containerPointToLatLng(pt)));
});

const r6 = (x) => +x.toFixed(6);
function endDrag(e, commit) {
  if (!drag || e.pointerId !== drag.id) return;
  const { pts } = drag;
  drag.layer.remove(); drag = null;
  const size = L.bounds(pts).getSize();
  if (!commit || pts.length < 2 || size.x < 8 || size.y < 8) return;   // ignore stray clicks
  let shape;
  if (drawShape === 'box') shape = boxPts(pts[0], pts[1]);
  else {
    // A stroke has a point every few pixels: smooth it down to at most MAX_AREA, keeping the shape.
    let tol = 1.5;
    do shape = L.LineUtil.simplify(pts, (tol *= 1.5)); while (shape.length > MAX_AREA);
    if (shape.length < 3) return;
  }
  commitArea(shape.map((p) => { const ll = clampLat(map.containerPointToLatLng(p)); return [r6(ll.lat), r6(ll.lng)]; }));
  setDrawMode(false);
}
cont.addEventListener('pointerup', (e) => endDrag(e, true));
cont.addEventListener('pointercancel', (e) => endDrag(e, false));

// One button for the area: draw one; while drawing, cancel; once set (highlighted), clear it.
$('draw').addEventListener('click', () => {
  if (drawMode) setDrawMode(false);
  else if (areaLayer) commitArea(null);
  else setDrawMode(true);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (drawMode) setDrawMode(false);
  else if (placeMode) setPlaceMode(false);
  else if (selectedId) { selectedId = null; renderList(); }
});

/* ---------- place one pin by hand ---------- */

let placeMode = false;
function setPlaceMode(on) {
  if (on && drawMode) setDrawMode(false);
  placeMode = on;
  cont.classList.toggle('placing', on);
  $('place').setAttribute('aria-pressed', String(on));
  updatePlaceBtn();
}
function updatePlaceBtn() {
  $('place').textContent = placeMode ? 'Click the map… (Esc)' : 'Place a pin';
}

map.on('click', (e) => {
  if (!placeMode) return;
  const ll = map.wrapLatLng(e.latlng);
  placePin(Math.max(-85, Math.min(85, ll.lat)), ll.lng);
});
$('place').addEventListener('click', () => setPlaceMode(!placeMode));

/* ---------- share ---------- */

function shareUrl() {
  updateUrl();
  const u = new URL(location.href);
  // localhost links are useless to anyone else: swap in the LAN address when the server exposes one.
  if (serverInfo?.lan?.length && /^(localhost|127\.0\.0\.1)$/.test(u.hostname)) u.hostname = serverInfo.lan[0];
  return u;
}

let shareTimer = null;
// navigator.clipboard needs a secure context (not plain-http LAN addresses); fall back to execCommand.
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const t = el('textarea', { value: text }); document.body.append(t); t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch {}
  t.remove();
  return ok;
}

const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
$('share').innerHTML = LINK_ICON;
// An icon button: it flashes ✓ (or ✗), and the note line says what happened.
$('share').addEventListener('click', async () => {
  const u = shareUrl(), href = u.href;
  const ok = await copyText(href);
  const local = /^(localhost|127\.0\.0\.1)$/.test(u.hostname);
  $('share').textContent = ok ? '✓' : '✗';
  notice(!ok ? 'Could not copy: use the address bar.' : local ? 'Link copied (works on this machine only).' : 'Share link copied.');
  clearTimeout(shareTimer);
  shareTimer = setTimeout(() => ($('share').innerHTML = LINK_ICON), 1500);
});

/* ---------- transient notices ---------- */

let noticeTimer = null;
function notice(msg, ms = 4500) {
  $('live').textContent = msg;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => ($('live').textContent = ''), ms);
}

/* ---------- markers ---------- */

// Player avatars: minidenticons (<1 KB, MIT) turns a player id into a small symmetric pixel avatar,
// the same on every screen. Pins show their dropper's avatar; if the library can't load they keep
// their numbers (numbers stay in the list, the card, chat links and the marker tooltip either way).
let identicon = null;
import('https://cdn.jsdelivr.net/npm/minidenticons@4.2.1/minidenticons.min.js')
  .then((m) => { identicon = m.minidenticon; syncMarkers(); renderRoom(); })
  .catch(() => {});
// The SVG is built from the id's hash alone (no text from the id ends up in it), so it's safe as HTML.
const avatarEl = (c, cls) => el('i', { className: cls, innerHTML: identicon(c) });

function pinIcon(p, latest) {
  const c = colorOf(p.by);
  const pin = el('div', { className: 'pin' }, identicon ? avatarEl(p.by, 'av') : el('span', {}, String(p.n)));
  if (c) pin.style.setProperty('--pc', c);
  return L.divIcon({
    className: 'pin-icon' + (latest ? ' latest' : '') + (c ? ' owned' : '') + (p.manual ? ' manual' : ''),
    // .size scales with votes; .drop is animated separately (bounce), so they must not share a transform
    html: el('div', { className: 'size' }, el('div', { className: 'drop' }, pin), el('b', { className: 'vb', hidden: true })),
    iconSize: [30, 30],
    iconAnchor: [15, 32],
  });
}

// Votes count as a share of the people voting, so the same +2 says more in a room of 4 than of 10,
// and everyone agreeing is the biggest a pin gets. √ makes the first vote or two already obvious
// (+1 of 8 ≈ 1.5×, +4 of 8 ≈ 2×, all 8 ≈ 2.4×); downvoted pins shrink and fade instead.
function voterCount() {
  const who = new Set(room.online);
  for (const p of pins) for (const c of Object.keys(p.votes)) who.add(c);   // votes from people who left still count
  return Math.max(who.size, 2);
}
function voteLook(s, n) {
  const f = Math.max(-1, Math.min(1, s / n)), r = Math.sqrt(Math.abs(f));
  return f >= 0 ? { scale: 1 + 1.4 * r, opacity: 1 } : { scale: 1 - 0.45 * r, opacity: 1 - 0.5 * r };
}
function sizeMarker(m, p, n) {
  const s = m.getElement()?.querySelector('.size');
  if (!s) return;
  const sc = score(p), { scale, opacity } = voteLook(sc, n);
  s.style.transform = `scale(${scale})`;
  s.style.opacity = opacity;
  s.classList.toggle('neg', sc < 0);
  const b = s.querySelector('.vb');
  b.hidden = !sc;
  b.textContent = sc > 0 ? `+${sc}` : String(sc);
  b.classList.toggle('down', sc < 0);
  b.style.transform = `scale(${1 / scale})`;
}

function bounce(marker) {
  const d = marker?.getElement()?.querySelector('.drop');
  if (d) d.animate(
    [{ transform: 'translateY(-36px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 380, easing: 'cubic-bezier(.2,.8,.3,1.25)' });
}

// Make the map's markers match `pins`; animate the ids in `animate`.
function syncMarkers(animate = []) {
  const ids = new Set(pins.map((p) => p.id)), n = voterCount();
  for (const [id, m] of markers) if (!ids.has(id)) { m.remove(); markers.delete(id); }
  pins.forEach((p, i) => {
    let m = markers.get(p.id);
    if (!m) {
      m = L.marker([p.lat, p.lng], { title: `#${p.n}` }).addTo(map);
      m.on('click', () => select(p.id, false));
      markers.set(p.id, m);
    } else if (m.getLatLng().lat !== p.lat || m.getLatLng().lng !== p.lng) m.setLatLng([p.lat, p.lng]);   // a moved pin
    const sig = `${p.n}|${i === 0}|${colorOf(p.by)}|${!!identicon}`;
    if (m._sig !== sig) { m.setIcon(pinIcon(p, i === 0)); m._sig = sig; }
    if (m._label !== (p.label || '')) {
      m._label = p.label || '';
      m.unbindTooltip();
      if (m._label) m.bindTooltip(el('span', {}, m._label), { permanent: true, direction: 'bottom', offset: [0, 2], className: 'pin-tag', opacity: 1 });
    }
    sizeMarker(m, p, n);
    m.setZIndexOffset(i === 0 ? 1000 : Math.max(0, score(p)) * 10);   // popular pins sit on top
    if (animate.includes(p.id)) bounce(m);
  });
}

// One pin per spot: a pin within MERGE_M of an existing one merges into it (see server.js).
const MERGE_M = 100;   // same as the server
function meters(aLat, aLng, bLat, bLng) {   // great-circle distance; longitudes may differ by a turn
  const rad = Math.PI / 180, dLng = ((((bLng - aLng) % 360) + 540) % 360) - 180;
  const h = Math.sin(((bLat - aLat) * rad) / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin((dLng * rad) / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(h)));
}
function nearestPin(lat, lng) {
  let near = null, best = MERGE_M;
  for (const p of pins) { const d = meters(lat, lng, p.lat, p.lng); if (d <= best) { best = d; near = p; } }
  return near;
}

// A merge, for everyone in the room: a ghost pin slides from where it was placed into the pin it
// joined, which pulses, and a short note says what happened. Yours also selects that pin.
function showMerge(m) {
  const marker = markers.get(m.id), target = pins.find((p) => p.id === m.id);
  if (marker) {
    const a = map.latLngToContainerPoint([m.lat, m.lng]), b = map.latLngToContainerPoint(marker.getLatLng());
    const ghost = el('div', { className: 'ghost' });
    ghost.style.cssText = `left:${a.x}px;top:${a.y}px;--pc:${colorOf(m.by) || '#8e24aa'}`;
    cont.append(ghost);
    ghost.animate(
      [{ transform: 'translate(-50%, -100%)', opacity: 0.85 }, { transform: `translate(calc(-50% + ${b.x - a.x}px), calc(-100% + ${b.y - a.y}px)) scale(.5)`, opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(.4,0,.2,1)' },
    ).finished.then(() => {
      ghost.remove();
      marker.getElement()?.querySelector('.drop')?.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }].map((k) => ({ ...k, transformOrigin: '50% 100%' })),
        { duration: 450, easing: 'ease-out' });
    });
  }
  const name = `#${m.n}${target?.label ? ` ${target.label}` : ''}`;
  if (m.by === cid) {
    selectedId = m.id;
    renderList();
    mapNote(`Merged into ${name}${m.upvoted ? ' · +1' : ' (already voted)'}`);
  } else mapNote(`${nameOf(m.by)}'s pin merged into ${name}`);
}

// Uniform in screen space (Web Mercator), so pins don't bunch toward the poles in tall areas:
// random points in the area's bounding box (or the visible map) until one is inside the shape.
// Bounds are unwrapped, so areas crossing the antimeridian work; wrapLatLng folds the result back.
// Prefers spots at least MERGE_M from every pin, so a drop is a new place rather than a merge; when
// the area has none left, the first spot inside it (which then merges into its nearest pin).
function randomPoint() {
  const Z = 20, b = areaLayer ? areaLayer.getBounds() : map.getBounds();
  const a = map.project(b.getNorthWest(), Z), c = map.project(b.getSouthEast(), Z);
  const tries = Math.min(5000, Math.ceil(400000 / (pins.length + 1)));   // bound the distance checks
  let fallback = null;
  for (let i = 0; i < tries; i++) {
    const ll = map.wrapLatLng(map.unproject(L.point(a.x + Math.random() * (c.x - a.x), a.y + Math.random() * (c.y - a.y)), Z));
    const p = { lat: Math.max(-85, Math.min(85, ll.lat)), lng: ll.lng };
    if (!inArea(p.lat, p.lng)) continue;   // the server runs the same test
    if (!nearestPin(p.lat, p.lng)) return p;
    fallback ??= p;
  }
  return fallback;   // null: a sliver too thin to hit
}

/* ---------- history list ---------- */

const showNewest = () => $('list').firstElementChild?.scrollIntoView({ block: 'nearest' });

function renderList() {
  const list = $('list');
  const mine = pins.filter((p) => p.by === cid).length;
  $('count').textContent = pins.length ? `Pins · ${pins.length}` : 'Pins';
  $('clear').hidden = !mine;
  $('clear').textContent = 'Clear mine';
  $('sort').textContent = `Sort: ${sortMode === 'top' ? 'top' : 'newest'}`;
  updatePlaceBtn();
  renderDetail();
  // Room updates re-render the list; while a label is being typed in it, leave the rows (and focus) alone.
  if (labelEdit && list.contains(labelInput)) return;
  list.replaceChildren();
  if (!pins.length) {
    list.append(el('li', { className: 'empty' }, 'No pins yet.'));
    return;
  }
  const shown = sortMode === 'top' ? [...pins].sort((a, b) => score(b) - score(a) || b.ts - a.ts) : pins;
  for (const p of shown) {
    const c = colorOf(p.by);
    const li = el('li', { className: [p.id === pins[0].id && 'latest', c && 'owned', p.id === selectedId && 'sel'].filter(Boolean).join(' ') });
    if (c) li.style.setProperty('--pc', c);

    const v = myVote(p);
    const up = el('button', { type: 'button', title: 'Upvote', className: v === 1 ? 'on' : '' }, '▲');
    const down = el('button', { type: 'button', title: 'Downvote', className: v === -1 ? 'on' : '' }, '▼');
    up.addEventListener('click', (e) => { e.stopPropagation(); vote(p, 1); });
    down.addEventListener('click', (e) => { e.stopPropagation(); vote(p, -1); });

    const acts = el('div', { className: 'acts' });
    if (p.by === cid) {
      const del = el('button', { title: 'Delete pin', type: 'button' }, '×');
      del.addEventListener('click', (e) => { e.stopPropagation(); removePin(p.id); });
      acts.append(del);
    }

    // First line: the label, or the coordinates until there is one; on your own pins it's the click
    // target for editing the label. Second line (rooms): who dropped it. Then delete, then votes.
    const coords = `${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
    const first = el('span', { className: p.label ? 'lbl' : 'll', title: p.label ? coords : '' }, p.label || coords);
    if (p.by === cid) {
      first.classList.add('mine');
      first.title = p.label ? `${coords} · click to edit the label` : 'Click to add a label';
      first.addEventListener('click', (e) => { e.stopPropagation(); startLabel(p); });
    }
    li.append(
      el('span', { className: 'num' }, String(p.n)),
      el('div', { className: 'meta' },
        labelEdit === p.id ? labelInput : el('div', { className: 'coords' }, p.manual ? el('span', { title: 'Placed by hand' }, '✋ ') : '', first),
        el('div', { className: 'when' }, nameOf(p.by))),
      acts,
      el('div', { className: 'votes seg' }, up, el('b', {}, String(score(p))), down),
    );
    li.addEventListener('click', () => select(p.id, true));
    list.append(li);
  }
}

/* ---------- selected-pin card: where is it, in Google Maps and OSM ---------- */

const detail = el('div', { id: 'detail', className: 'float', hidden: true });
cont.append(detail);
L.DomEvent.disableClickPropagation(detail);
L.DomEvent.disableScrollPropagation(detail);

const gmapsUrl = (p) => `https://www.google.com/maps/search/?api=1&query=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1"/></svg>';
const osmUrl = (p) => `https://www.openstreetmap.org/?mlat=${p.lat.toFixed(6)}&mlon=${p.lng.toFixed(6)}#map=17/${p.lat.toFixed(6)}/${p.lng.toFixed(6)}`;

// Labels: a couple of words naming the spot (shop, park, …), set by whoever dropped the pin and
// edited in place in the pin list: click your pin's label (or "+ label") to type.
const MAX_LABEL = 30;   // same as the server
let labelEdit = null;   // id of the pin whose label is being typed
const labelInput = el('input', { className: 'inline-edit strong', maxLength: MAX_LABEL, placeholder: 'Shop, park, corner…', spellcheck: false, autocomplete: 'off', enterKeyHint: 'done' });
labelInput.setAttribute('aria-label', 'Pin label');
labelInput.addEventListener('click', (e) => e.stopPropagation());   // don't select the pin
labelInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); endLabel(true); }
  else if (e.key === 'Escape') { e.stopPropagation(); endLabel(false); }   // cancel the edit, not deselect the pin
});
labelInput.addEventListener('blur', () => endLabel(true));
function startLabel(p) {
  labelEdit = p.id;
  labelInput.value = p.label || '';
  renderList();
  labelInput.scrollIntoView({ block: 'nearest' });
  labelInput.focus();
  labelInput.select();
}
function endLabel(save) {
  if (!labelEdit) return;
  const id = labelEdit;
  labelEdit = null;
  const p = pins.find((x) => x.id === id), v = labelInput.value.replace(/\s+/g, ' ').trim();
  if (save && p && v !== (p.label || '')) setLabel(p, v);
  renderList();
}
function setLabel(p, label) {
  post({ type: 'label', pin: p.id, label });
}

function renderDetail() {
  const p = pins.find((x) => x.id === selectedId);
  detail.hidden = !p;
  if (!p) return;
  // Compact: a label, then open (↗) and copy buttons for its URL.
  const link = (label, url) => {
    const open = el('a', { className: 'btn sm', href: url, target: '_blank', rel: 'noopener', title: `Open in ${label}` }, '↗');
    const copy = el('button', { type: 'button', className: 'btn sm', title: `Copy ${label} link` });
    const icon = () => (copy.innerHTML = COPY_ICON);
    icon();
    copy.addEventListener('click', async () => {
      copy.textContent = (await copyText(url)) ? '✓' : '✗';
      setTimeout(icon, 1200);
    });
    open.setAttribute('aria-label', `Open in ${label}`);
    copy.setAttribute('aria-label', `Copy ${label} link`);
    return el('span', { className: 'lk' }, label, open, copy);
  };
  const close = el('button', { type: 'button', className: 'x', title: 'Close (Esc)' }, '×');
  close.addEventListener('click', () => { selectedId = null; renderList(); });
  const title = `#${p.n}${p.label ? ` ${p.label}` : ''} · ${nameOf(p.by)}${p.manual ? ' · by hand' : ''}`;
  detail.replaceChildren(
    el('div', { className: 'dhead' }, el('span', { title }, title), close),
    el('div', { className: 'dcoords' }, `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`),
    el('div', { className: 'links' }, link('Google', gmapsUrl(p)), link('OSM', osmUrl(p))),
  );
}

// Selecting a pin zooms in far enough to see shops and street names around it,
// but never zooms out. pan=false (a click on the marker itself) zooms around the marker instead.
const CLOSE_ZOOM = 17;
function select(id, pan) {
  selectedId = id;

  if (!p) return;
  const z = Math.max(map.getZoom(), CLOSE_ZOOM);
  if (pan) map.setView([p.lat, p.lng], z);

// Only the picture under the pins changes; pins, areas, drops and votes work the same either way.
// Google mode falls back to OSM (instead, not underneath) where Google can't be used: unreachable,
// slow to show up, or zoomed out past where the two line up.
//
// Google: the keyless embed behind google.com/maps "Share → Embed a map", centred with ll= so it
// draws no marker. Same Web Mercator tiles as OSM, so streets line up. Not part of Google's
// documented API. Leaflet keeps all the input: the iframe ignores the pointer and sits in a map pane,
// so it moves with the pins while dragging and scales with them while zooming. Once the view settles
// somewhere the current one doesn't cover, a fresh one loads on top and replaces it.
const gpane = map.createPane('google');
gpane.style.zIndex = 250;            // above OSM tiles (200), below the limit area (400) and pins (600)
gpane.style.pointerEvents = 'none';
const GM = 0.25;                     // extra map loaded past each edge, so short drags stay on Google
let base = store.get(K.base, 'osm') === 'google' ? 'google' : 'osm';   // OSM unless you've picked Google

// The OSM option: OpenFreeMap's "Liberty" style (vector tiles from OSM data; no key, no stated limits),

// plain OSM tiles show meanwhile, and stay if it can't run (no WebGL, CDN or style server down).
// MapLibre 5: v6 is ES modules with a separate worker file, which a page can't start from a CDN.
const MAPLIBRE = 'https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl';
const MAPLIBRE_LEAFLET = 'https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js';
const LIBERTY_STYLE = 'https://tiles.openfreemap.org/styles/liberty';
const LIBERTY_CREDIT = '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';

    await loadScript(`${MAPLIBRE}.js`);
    await loadScript(MAPLIBRE_LEAFLET);   // picks up the global maplibregl
    const style = latinLabels(await (await fetch(LIBERTY_STYLE)).json());

    // time Leaflet removes the layer, so switching away would otherwise leave it in the credit line.

// MapLibre lays text out glyph by glyph, without the shaping Bangla (and other Indic scripts) need, so
// those names come out as broken letters. Where a name isn't in Latin script, label with its Latin
// form only (the tiles carry a transliteration in name:latin); Google's map shows the native names.
function latinLabels(style) {
  const latin = ['case', ['has', 'name:nonlatin'], ['get', 'name:latin'], ['coalesce', ['get', 'name_en'], ['get', 'name']]];
  for (const l of style.layers) {

    if (tf && JSON.stringify(tf).includes('name:nonlatin')) l.layout['text-field'] = latin;

// Show or hide the OSM option's map: Liberty when it works, else plain tiles. Liberty is swapped in
// only once its style has loaded, so the plain tiles never give way to a blank map.
function osmOn(on) {
  osmWanted = on;
  if (!on) { raster.remove(); liberty?.remove(); return; }
  if (libertyState === 'idle') loadLiberty();
  if (libertyState !== 'ready') { if (!map.hasLayer(raster)) raster.addTo(map); return; }
  if (map.hasLayer(liberty)) return;
  liberty.addTo(map);
  const ml = liberty.getMaplibreMap();
  if (ml.isStyleLoaded()) { raster.remove(); return; }
  ml.once('load', () => raster.remove());

    if (ml.isStyleLoaded()) return;

function presence(before, after) {
  for (const c of after) {
    if (c === cid || before.has(c)) continue;
    if (leaving.has(c)) { clearTimeout(leaving.get(c)); leaving.delete(c); continue; }   // back already
    addMsg({ sys: true, text: `${nameOf(c)} has joined` });
  }
  for (const c of before) {
    if (c === cid || after.has(c) || leaving.has(c)) continue;
    leaving.set(c, setTimeout(() => {
      leaving.delete(c);
      if (!room.online.includes(c)) addMsg({ sys: true, text: `${nameOf(c)} has left` });
    }, 5000));
  }
}

let firstState = true, seedArea = null, fitOnFirst = false, helpText = '';

function applyState(s) {
  const first = firstState; firstState = false;
  const prev = new Map(pins.map((p) => [p.id, p]));
  const wasOnline = new Set(room.online);
  room.players = s.players; room.online = s.online;
  if (!first) presence(wasOnline, new Set(s.online));
  pins = s.pins.map(normalize);

  // Area: server is the source of truth. A room's creator seeds it once with their current area.
  const same = JSON.stringify(s.area) === JSON.stringify(areaArr());
  if (first && seedArea && !s.area) post({ type: 'area', area: seedArea });
  else if (!same) {
    setArea(s.area);
    if (!first && s.areaBy !== cid) notice(`${nameOf(s.areaBy)} ${s.area ? 'updated' : 'cleared'} the area`);
  }
  if (first && fitOnFirst && s.area) fitArea();
  if (first) seedArea = null;

  // "fresh" = new pins plus pins that moved (same id, new spot)
  const fresh = first ? [] : pins.filter((p) => { const o = prev.get(p.id); return !o || o.lat !== p.lat || o.lng !== p.lng; });
  const mine = fresh.find((p) => p.by === cid);
  if (mine) { selectedId = mine.id; showNewest(); }
  const theirs = fresh.filter((p) => p.by !== cid);
  if (theirs.length) {
    const t = theirs[0];
    notice(`${nameOf(t.by)} ${prev.has(t.id) ? `moved their pin #${t.n}` : `dropped pin #${t.n}`}${theirs.length > 1 ? ` (+${theirs.length - 1})` : ''}`);
  }
  syncMarkers(fresh.map((p) => p.id));
  renderList();
  renderRoom();
  const sig = JSON.stringify(s.players);   // chat names follow renames
  if (sig !== chatSig) { chatSig = sig; renderChat(); }
  refreshPinRefs();   // labels and owners behind "#n" links
  room.range = s.range; room.avail = s.avail || {}; room.tstat = s.tstat || {}; room.tvotes = s.tvotes || {}; room.event = s.event; renderHname();
  renderTime();
}

function connect(id, seed = null) {
  for (const t of leaving.values()) clearTimeout(t);   // pending "left" notes belong to the old room
  leaving.clear();
  es?.close();
  roomId = id; seedArea = seed; firstState = true; status = 'connecting';
  fitOnFirst = !parseHash().view;
  room = { players: {}, online: [] };
  pins = []; selectedId = null; chat = []; chatSig = '';
  syncMarkers(); renderList(); renderRoom(); renderChat();
  es = new EventSource(`/api/rooms/${id}/events?${new URLSearchParams({ cid, name: myName })}`);
  es.addEventListener('state', (e) => { status = 'live'; helpText = ''; applyState(JSON.parse(e.data)); });
  // Full history on every (re)connect, then one message per event.
  es.addEventListener('merge', (e) => showMerge(JSON.parse(e.data)));
  es.addEventListener('chat', (e) => {
    const d = JSON.parse(e.data);
    if (d.msg) addMsg(d.msg);
    else { chat = d.history; renderChat(); }
  });
  es.onerror = () => {
    const closed = es.readyState === EventSource.CLOSED;   // browser gave up (bad status / content type)
    status = closed ? 'offline' : 'reconnecting';
    helpText = closed ? 'Checking why…' : '';
    renderRoom();
    if (closed) diagnose(id).then((msg) => { if (roomId === id && status === 'offline') { helpText = msg; renderRoom(); } });
  };
}

const RUN_HINT = 'Run `node server.js` in the random-pin folder and open the URL it prints.';

// Work out *why* the stream failed, so the message says what to fix.
async function diagnose(id) {
  if (location.protocol === 'file:') return `This page was opened as a file. ${RUN_HINT}`;
  try { serverInfo = await (await fetch('/api/info')).json(); } catch {
    return `${location.host} is not running server.js (static files only, e.g. python -m http.server). ${RUN_HINT}`;
  }
  const ac = new AbortController();
  try {
    const r = await fetch(`/api/rooms/${id}/events?cid=${cid}`, { signal: ac.signal });
    ac.abort();
    return r.ok
      ? 'The server is up but the live stream is being cut off. A proxy or tunnel in front of it may be buffering event streams.'
      : `The server refused this room (HTTP ${r.status}).`;
  } catch { return 'Could not reach the server.'; }
}

function locate() {
  if (!initialFit || areaLayer || hash.room || !window.isSecureContext || !navigator.geolocation) return;

    map.fitBounds(L.latLng(latitude, longitude).toBounds(Math.min(Math.max(accuracy * 4, 8000), 300000)), { maxZoom: 15 });
  }, () => {}, { timeout: 15000, maximumAge: 10 * 60e3 });
}

function tutorial(done) {

  let i = 0, lit = [];

  const next = el('button', { type: 'button', className: 'btn primary' });

  card.setAttribute('role', 'dialog');
  card.setAttribute('aria-labelledby', 'tuth');
  const unlight = () => lit.forEach((e) => e.classList.remove('tut-hl'));
  function show() {
    unlight();
    const s = steps[i];
    goTo(s.v);
    setDemo(!!s.demo);
    place();
    lit = s.els.map($).filter((e) => e?.getClientRects().length);   // only what's on screen (e.g. "mp" or "room")
    lit.forEach((e) => e.classList.add('tut-hl'));

    head.textContent = s.h; text.textContent = typeof s.t === 'function' ? s.t() : s.t;
    step.textContent = `${i + 1}/${steps.length}`;
    next.textContent = i === steps.length - 1 ? 'Done' : 'Next';
  }
  function close() {
    unlight(); card.remove();
    setDemo(false);
    document.removeEventListener('keydown', onKey, true);
    removeEventListener('resize', place);
    if (tabMQ.matches) {

      setTab(before.tab);

    } else setView(before.view);
    done();

  const onKey = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); } };
  next.addEventListener('click', () => (++i < steps.length ? show() : close()));
  skip.addEventListener('click', close);
  document.addEventListener('keydown', onKey, true);
  addEventListener('resize', place);
  document.body.append(card);
  L.DomEvent.disableClickPropagation(card);
  L.DomEvent.disableScrollPropagation(card);
  show();
  next.focus();
}

/* ---------- time: when everyone is free (rooms) ---------- */

// The room's grid: `days` days from `start`, hours `from`..`to`, in time zone `tz` (see server.js).
// Each cell is an hour, stored as the absolute instant it starts, so the grid is drawn in the room's
// zone and anyone elsewhere is told so.
const HOUR = 3600e3;
const myTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let view = 'space', tSel = null, paint = null;   // tSel: the hour clicked in the list (outlined on the calendar)

// Minutes `tz` is ahead of UTC at instant `ms`.
function tzOffset(ms, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(ms).map((x) => [x.type, x.value]));
  return (Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000) / 60e3;
}
// The instant it's `hour`:00 on day `start` + `day` in `tz`.
function zonedHour(start, day, hour, tz) {
  const [y, m, d] = start.split('-').map(Number), wall = Date.UTC(y, m - 1, d + day, hour);
  let t = wall;
  for (let i = 0; i < 2; i++) t = wall - tzOffset(t, tz) * 60e3;   // twice settles a DST edge
  return t;
}
const todayIn = (tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(Date.now());
// What the grid shows. With a time limit (someone's box, like the map's limit area): just that range,
// stretched to fill the view, the way the map zooms to its area. Without one: four weeks from today,
// all 24 hours, in your own time zone; either way 7 days fit at once and more scroll sideways.
const gridSpec = () => (room.range ? { ...room.range, fit: true } : { tz: myTz, start: todayIn(myTz), days: 28, from: 0, to: 24, fit: false });
let tLimitMode = false, limitBox = null;   // drawing a time limit: the box so far, {from: [d, h], to: [d, h]}
const fmtIn = (ms, tz, o) => new Intl.DateTimeFormat([], { timeZone: tz, ...o }).format(ms);
const hourLabel = (h) => `${String(h % 24).padStart(2, '0')}:00`;
// "Fri 16": built from parts, since some locales put the day first ("16 Fri").
const dayLabel = (ms, tz) => `${fmtIn(ms, tz, { weekday: 'short' })} ${fmtIn(ms, tz, { day: 'numeric' })}`;
const slotLabel = (ms, tz) => `${fmtIn(ms, tz, { weekday: 'short', day: 'numeric', month: 'short' })}, ${fmtIn(ms, tz, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })}`;

}

// Who's free when: slot -> [cids], with the paint stroke in progress counted as already sent.
function freeBySlot() {
  const avail = { ...(room.avail || {}) };
  if (paint?.kind === 'paint') {   // (a limit box being drawn paints nothing)
    const mine = new Set(avail[cid] || []);
    for (const x of paint.add) mine.add(x);
    for (const x of paint.remove) mine.delete(x);
    avail[cid] = [...mine];
  }
  const m = new Map();
  for (const [c, list] of Object.entries(avail)) for (const x of list) (m.get(x) ?? m.set(x, []).get(x)).push(c);
  return m;
}
const topPin = () => [...pins].sort((a, b) => score(b) - score(a) || b.ts - a.ts).find((p) => score(p) > 0) || null;

// Who counts: everyone answering by hours, i.e. who hasn't said "free anytime" or "skip": the people
// who painted hours here, and anyone online who hasn't yet. An hour is everyone's (green) only when all
// of them are free in it. "Free anytime" people aren't counted into any hour (they'd make every hour
// look busier); they and skippers weigh in by voting.
function timeWho(slots, free) {
  const stat = room.tstat || {}, any = Object.keys(stat).filter((c) => stat[c] === 'any');
  const skip = Object.keys(stat).filter((c) => stat[c] === 'out');
  const painters = new Set();
  for (const x of slots) for (const c of free.get(x) || []) if (!stat[c]) painters.add(c);
  const waiting = [...new Set(room.online || [])].filter((c) => !stat[c] && !painters.has(c));
  const counted = [...painters, ...waiting];
  const freeAt = (x) => (free.get(x) || []).filter((c) => painters.has(c));
  return { any, skip, painters, waiting, counted, freeAt };
}

// An hour's state for colouring: nobody, one person, two or more, or everyone who counts (green, even
// when that's one person).
function hourState(who, N, x) {
  const f = who.freeAt(x), n = f.length, all = N >= 1 && n === N;
  return { f, n, all, cls: all ? 'all' : n >= 2 ? 'some' : n === 1 ? 'one' : 'nofree' };
}

// The calendar's hours, as instants (cached: working them out takes a while).
let slotCache = { key: '', slots: [] };
function rangeSlots(r) {
  const key = [r.tz, r.start, r.days, r.from, r.to].join('|');
  if (slotCache.key !== key) {
    const slots = [];
    for (let d = 0; d < r.days; d++) for (let h = r.from; h < r.to; h++) slots.push(zonedHour(r.start, d, h, r.tz));
    slotCache = { key, slots };
  }
  return slotCache.slots;
}
// Hour votes work like pin votes: ▲ +1 or ▼ −1 each, from anyone in the room.
const tVotesOf = (x) => room.tvotes?.[x] || {};
const tScore = (x) => Object.values(tVotesOf(x)).reduce((a, b) => a + b, 0);
const signed = (n) => (n > 0 ? `+${n}` : String(n));
// What the calendar and the room box both need: who counts, each hour's state, the hours worth listing
// (two or more free, everyone free, or voted on) best first, and the pick: the most-voted hour, picked
// automatically like the most-voted pin (ties: more people free, then earlier).
function timeModel() {
  const r = gridSpec(), slots = rangeSlots(r), free = freeBySlot();
  const who = timeWho(slots, free), N = who.counted.length;
  const st = new Map(slots.map((x) => [x, hourState(who, N, x)]));
  const ranked = slots.filter((x) => st.get(x).n >= 2 || st.get(x).all || Object.keys(tVotesOf(x)).length)
    .sort((a, b) => tScore(b) - tScore(a) || st.get(b).n - st.get(a).n || a - b);
  const top = ranked.length && tScore(ranked[0]) > 0 ? ranked[0] : null;
  return { r, slots, free, who, N, st, ranked, top };
}

function renderTime() {
  const m = roomId ? timeModel() : null;
  renderPick(m);
  if (view !== 'time' || !m) return;
  const { r, slots, free, who, N, st, ranked, top } = m, tz = r.tz;
  $('ttz').textContent = tz === myTz ? '' : `Times in ${tz} (you're in ${myTz})`;
  $('tlimit').textContent = tLimitMode ? 'Drag a box… (Esc)' : room.range ? 'Time limited ×' : 'Limit time';
  $('tlimit').classList.toggle('set', !!room.range && !tLimitMode);
  $('tlimit').setAttribute('aria-pressed', String(tLimitMode));
  $('tlimit').title = tLimitMode ? 'Drag a box over the days and hours everyone picks within' : room.range ? 'Everyone picks and votes within this range. Click to clear it.' : 'Drag a box on the calendar to set the days and hours everyone picks within';
  const myStat = room.tstat?.[cid] || 'hours';
  $('tany').setAttribute('aria-pressed', String(myStat === 'any'));
  $('tskip').setAttribute('aria-pressed', String(myStat === 'out'));
  if (!tClearTimer) { $('tclear').textContent = 'Clear mine'; $('tclear').hidden = !(room.avail?.[cid] || []).length; }

  const names = (cs) => cs.map((c) => (c === cid ? 'you' : nameOf(c))).join(', ');
  $('tpeople').textContent = [who.waiting.length && `no hours yet: ${names(who.waiting)}`, who.any.length && `free anytime: ${names(who.any)}`, who.skip.length && `skipping: ${names(who.skip)}`].filter(Boolean).join(' · ');
  if (tSel != null && !st.has(tSel)) tSel = null;

  // Grid: an hour column, then a column per day.
  const g = $('tgrid');
  g.classList.toggle('inactive', myStat !== 'hours' && !tLimitMode);
  g.classList.toggle('limiting', tLimitMode);
  // Fit the view: all the hours shown (24, or the limit's) share the height, and 7 days (or the limit's,
  // if fewer) share the width; more days than that scroll sideways.
  const tv = $('time'), shown = Math.min(r.days, 7);
  const colW = Math.max(36, Math.floor((tv.clientWidth - 56 - 4 * (shown - 1)) / shown));
  g.style.gridTemplateColumns = `auto repeat(${r.days}, ${colW}px)`;
  g.style.setProperty('--rowh', `${Math.max(14, Math.min(72, Math.floor((tv.clientHeight - 58) / (r.to - r.from))))}px`);
  const inBox = (d, h) => limitBox && d >= Math.min(limitBox.from[0], limitBox.to[0]) && d <= Math.max(limitBox.from[0], limitBox.to[0])
    && h >= Math.min(limitBox.from[1], limitBox.to[1]) && h <= Math.max(limitBox.from[1], limitBox.to[1]);
  const cells = [el('div')];
  for (let d = 0; d < r.days; d++) cells.push(el('div', { className: 'dh' }, dayLabel(zonedHour(r.start, d, 12, tz), tz)));
  const at = (d, h) => {
    if (h < r.from || h >= r.to) return null;
    const x = slots[d * (r.to - r.from) + (h - r.from)];
    return { x, ...st.get(x), mine: (free.get(x) || []).includes(cid) };
  };
  for (let h = r.from; h < r.to; h++) {
    cells.push(el('div', { className: 'hh' }, hourLabel(h)));
    for (let d = 0; d < r.days; d++) {
      const q = at(d, h), up = at(d, h - 1), down = at(d, h + 1), { x, f, n, all, mine } = q;
      const same = (o) => o && o.cls === q.cls && o.n === q.n;
      const cls = ['c', q.cls, h === r.from && 'first', h === r.to - 1 && 'last',
        n && !same(up) && 'runtop', n && !same(down) && 'runend',
        mine && 'mine', mine && !up?.mine && 'mtop', mine && !down?.mine && 'mend',   // (kept while free anytime too)
        x === tSel && 'sel', x === top && 'top', inBox(d, h) && 'lim'];
      const c = el('div', { className: cls.filter(Boolean).join(' ') });
      c.dataset.s = x; c.dataset.d = d; c.dataset.h = h;
      if (x === top) c.textContent = `★ ${signed(tScore(x))}`;
      else if ((n >= 2 || all) && !same(up)) c.textContent = all ? '✓' : String(n);   // how many free, once per stretch
      const nv = Object.keys(tVotesOf(x)).length;
      c.title = `${slotLabel(x, tz)} · ${n ? `${all ? 'everyone' : n} free: ${names(f)}` : 'nobody free yet'}${nv ? ` · votes ${signed(tScore(x))}` : ''}`;
      cells.push(c);
    }
  }
  g.replaceChildren(...cells);

  // The list (like the pin list): the hours worth listing, most votes first. A row: how many are free
  // (coloured like the grid), the time, who can't make it, and ▲ score ▼ (a vote steps through 0, like
  // a pin's: either arrow takes yours back). Clicking a row outlines its hour on the calendar.
  const list = ranked.filter((x, i) => i < 12 || Object.keys(tVotesOf(x)).length);   // voted hours always stay listed, so votes can be taken back
  $('tcount').textContent = ranked.length ? `Times · ${ranked.length}` : 'Times';
  $('tlist').replaceChildren(...(list.length ? list.map((x) => {
    const { f, n, all, cls } = st.get(x), mine = tVotesOf(x)[cid] || 0, missing = who.counted.filter((c) => !f.includes(c));
    const vote = (v) => (e) => { e.stopPropagation(); post({ type: 'tvote', slot: x, v: mine ? 0 : v }); };
    const up = el('button', { type: 'button', className: mine > 0 ? 'on' : '', title: mine ? 'Take back your vote' : 'Vote for this time' }, '▲');
    const down = el('button', { type: 'button', className: mine < 0 ? 'on' : '', title: mine ? 'Take back your vote' : 'Vote against this time' }, '▼');
    up.addEventListener('click', vote(1));
    down.addEventListener('click', vote(-1));
    const voters = Object.entries(tVotesOf(x)).map(([c, v]) => `${c === cid ? 'you' : nameOf(c)} ${v > 0 ? '▲' : '▼'}`).join(', ');
    const li = el('li', { className: x === tSel ? 'sel' : '', title: voters ? `Votes: ${voters}` : '' },
      el('span', { className: `num ${cls}` }, all ? '✓' : String(n)),
      el('div', { className: 'meta' }, el('div', { className: 'coords' }, el('b', {}, `${x === top ? '★ ' : ''}${slotLabel(x, tz)}`)),
        el('div', { className: 'when' }, all ? 'everyone' : n ? `not: ${names(missing)}` : 'nobody marked it')),
      el('div', { className: 'votes seg' }, up, el('b', {}, String(tScore(x))), down));
    li.addEventListener('click', () => {
      tSel = tSel === x ? null : x;
      renderTime();
      $('tgrid').querySelector('.c.sel')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    return li;
  }) : [el('li', { className: 'empty' }, !N ? 'Nobody has marked any hours yet.' : 'No hour has two or more people free yet.')]));
}

// Strokes on the grid: painting your free hours, or (Limit time) drawing the range box. Both take the
// rectangle between the pressed cell and the one under the pointer (as in When2meet), so a fast drag
// can't skip cells and dragging back shrinks it. Mouse or pen: press and drag. Touch: a drag scrolls
// the calendar, a tap marks one hour, and press-and-hold (about 1/3 s) then drag paints a block.
// A paint stroke shows at once and is sent as one change when it ends.
const cellAt = (e) => document.elementFromPoint(e.clientX, e.clientY)?.closest('#tgrid .c');
let hold = null;   // touch: {id, x, y, cell, timer}, until it becomes a stroke, a tap or a scroll
function beginStroke(c, pointerId) {
  if (!tLimitMode && (room.tstat?.[cid] || 'hours') !== 'hours') return mapNote('You said "free anytime" or "skip": turn that off to paint hours.');
  try { $('tgrid').setPointerCapture(pointerId); } catch {}
  const at = [+c.dataset.d, +c.dataset.h];
  if (tLimitMode) { paint = { kind: 'limit', from: at, to: at }; limitBox = { from: at, to: at }; return renderTime(); }
  paint = { kind: 'paint', from: at, to: at, add: new Set(), remove: new Set(), mode: (room.avail?.[cid] || []).includes(+c.dataset.s) ? 'remove' : 'add' };
  fillStroke();
}
$('tgrid').addEventListener('pointerdown', (e) => {
  const c = e.target.closest('.c');
  if (!c || e.button !== 0) return;
  if (e.pointerType === 'touch') {
    hold = { id: e.pointerId, x: e.clientX, y: e.clientY, cell: c, timer: setTimeout(() => {
      const h = hold;
      hold = null;
      navigator.vibrate?.(10);
      beginStroke(h.cell, h.id);
    }, 350) };
    return;
  }
  e.preventDefault();
  beginStroke(c, e.pointerId);
});
function strokeTo(c) {
  if (!c || (+c.dataset.d === paint.to[0] && +c.dataset.h === paint.to[1])) return;
  paint.to = [+c.dataset.d, +c.dataset.h];
  if (paint.kind === 'limit') { limitBox.to = paint.to; renderTime(); } else fillStroke();
}
$('tgrid').addEventListener('pointermove', (e) => {
  if (hold && e.pointerId === hold.id && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 8) { clearTimeout(hold.timer); hold = null; return; }   // a scroll
  if (!paint) return;
  paint.pt = { x: e.clientX, y: e.clientY };
  strokeTo(cellAt(e));
  if (!paint.raf) paint.raf = requestAnimationFrame(edgeScroll);
});
// While painting on touch, the finger paints instead of scrolling.
$('tgrid').addEventListener('touchmove', (e) => { if (paint) e.preventDefault(); }, { passive: false });
// Held near (or past) an edge of the grid area: scroll that way, and keep the stroke under the
// pointer (taking the cell just inside the edge), so a stroke can reach days or hours out of view.
function edgeScroll() {
  if (!paint) return;
  paint.raf = null;
  const box = $('time').getBoundingClientRect(), m = 36, { x, y } = paint.pt;
  const dx = x < box.left + m + 40 ? -12 : x > box.right - m ? 12 : 0;   // + the hour labels on the left
  const dy = y < box.top + m + 20 ? -12 : y > box.bottom - m ? 12 : 0;   // + the day labels on top
  if (!dx && !dy) return;
  $('time').scrollBy(dx, dy);
  const cx = Math.min(Math.max(x, box.left + m + 44), box.right - m), cy = Math.min(Math.max(y, box.top + m + 24), box.bottom - m);
  strokeTo(cellAt({ clientX: cx, clientY: cy }));
  paint.raf = requestAnimationFrame(edgeScroll);
}
function fillStroke() {
  const r = gridSpec(), [d0, h0] = paint.from, [d1, h1] = paint.to, cells = new Set();
  for (let d = Math.min(d0, d1); d <= Math.max(d0, d1); d++) {
    for (let h = Math.min(h0, h1); h <= Math.max(h0, h1); h++) cells.add(zonedHour(r.start, d, h, r.tz));
  }
  if (paint.mode === 'add') { paint.add = cells; paint.remove = new Set(); } else { paint.remove = cells; paint.add = new Set(); }
  renderTime();
}
const addDays = (start, n) => { const [y, m, d] = start.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
function endStroke() {
  if (!paint) return;
  if (paint.kind === 'limit') {   // the box becomes the room's range
    const r = gridSpec(), [d0, h0] = paint.from, [d1, h1] = paint.to;
    const range = { tz: r.tz, start: addDays(r.start, Math.min(d0, d1)), days: Math.abs(d1 - d0) + 1, from: Math.min(h0, h1), to: Math.max(h0, h1) + 1 };
    paint = null;
    room.range = range;
    post({ type: 'range', range });
    setLimitMode(false);
    $('time').scrollTo(0, 0);
    return;
  }
  const { add, remove } = paint;
  const mine = new Set(room.avail?.[cid] || []);
  for (const x of add) mine.add(x);
  for (const x of remove) mine.delete(x);
  room.avail = { ...room.avail, [cid]: [...mine] };   // shown now; the server's state confirms it
  paint = null;
  renderTime();
  if (add.size || remove.size) post({ type: 'avail', add: [...add], remove: [...remove] });
}
$('tgrid').addEventListener('pointerup', (e) => {
  if (hold && e.pointerId === hold.id) {   // a tap: just that hour
    clearTimeout(hold.timer);
    const c = hold.cell;
    hold = null;
    beginStroke(c, e.pointerId);
    return endStroke();
  }
  endStroke();
});
$('tgrid').addEventListener('pointercancel', (e) => {
  if (hold && e.pointerId === hold.id) { clearTimeout(hold.timer); hold = null; return; }
  endStroke();
});

// The tutorial's example pick, shown in the room box while it points there and nothing's picked yet.
let tutDemo = false;
function setDemo(on) {
  if (on === tutDemo) return;
  tutDemo = on && $('pick').hidden;
  if (!tutDemo) { renderTime(); return; }
  const d = new Date(); d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7)); d.setHours(18, 0, 0, 0);   // next Saturday, 18:00
  const ics = el('button', { type: 'button', className: 'btn icon', disabled: true, title: 'Add to your calendar (.ics)' });
  ics.innerHTML = CAL_ICON;
  $('pick').hidden = false;
  $('pick').replaceChildren(el('div', { className: 'pick' },
    el('div', { className: 'pick-head', title: 'Most voted (an example)' }, el('span', {}, '★'), el('span', { className: 'pick-label' }, 'Most voted, example'), el('span', {}, 'e.g.')),
    el('div', { className: 'pick-when' }, slotLabel(d.getTime(), myTz)),
    el('div', { className: 'pick-where' }, 'at ', el('b', {}, '#1 Rooftop cafe')), ics));
}

// The pick, in the room box (both views): the most-voted hour, at the most-voted pin if there is one,
// and a button to add it to your calendar.
function renderPick(m) {
  const box = $('pick'), x = m?.top ?? null;
  if (tutDemo) return;   // the tutorial's example is showing
  if (x == null) { box.replaceChildren(); box.hidden = true; return; }
  const p = topPin(), l = { slot: x, len: HOUR };
  const ics = el('button', { type: 'button', className: 'btn icon', title: 'Add to your calendar (.ics)', ariaLabel: 'Add to calendar' });
  ics.innerHTML = CAL_ICON;
  ics.addEventListener('click', () => downloadIcs(l, p));
  box.hidden = false;
  box.replaceChildren(el('div', { className: 'pick' },
    el('div', { className: 'pick-head', title: `Most voted: ${signed(tScore(x))}` }, el('span', {}, '★'), el('span', { className: 'pick-label' }, 'Most voted:'), el('span', {}, signed(tScore(x)))),
    el('div', { className: 'pick-when', title: slotLabel(x, m.r.tz) }, slotLabel(x, m.r.tz)),
    ...(p ? [el('div', { className: 'pick-where', title: `at #${p.n}${p.label ? ` ${p.label}` : ''}` }, 'at ', el('b', {}, `#${p.n}${p.label ? ` ${p.label}` : ''}`))] : []), ics));
}
// The huddle's name, at the top: editable in place by anyone, the title of everyone's calendar event,
// and the browser tab's. Empty, it reads "Huddle". The box is as wide as the name.
const hname = $('hname');
const huddleName = () => room.event?.title || 'Huddle';
const fitHname = () => { hname.size = Math.max(6, (hname.value || hname.placeholder).length + 1); hname.title = hname.value || 'This huddle\'s name, and its calendar event\'s title: click to change it'; };
function renderHname() {
  if (document.activeElement !== hname) hname.value = room.event?.title || '';
  fitHname();
  if (!document.title.startsWith('(@)')) document.title = huddleName();   // (an unseen mention keeps its mark)
}
hname.addEventListener('input', fitHname);
fitHname();
hname.addEventListener('change', () => post({ type: 'event', title: hname.value }));
hname.addEventListener('keydown', (e) => { if (e.key === 'Enter') hname.blur(); else if (e.key === 'Escape') { hname.value = room.event?.title || ''; hname.blur(); } });

// An .ics file for the picked time and place (RFC 5545: CRLF lines, folded at 75 octets). The time is
// written in your own time zone; the location is the pin's link on the map you have selected (Google
// or OSM); the title is the huddle's name.
function downloadIcs(l, p) {
  const stamp = (ms) => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const wall = (ms) => {   // local wall-clock time in myTz, as 20261017T110000
    const q = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: myTz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
      .formatToParts(ms).map((x) => [x.type, x.value]));
    return `${q.year}${q.month}${q.day}T${q.hour}${q.minute}${q.second}`;
  };
  const off = (ms) => { const m = tzOffset(ms, myTz), a = Math.abs(m); return `${m < 0 ? '-' : '+'}${String(Math.floor(a / 60)).padStart(2, '0')}${String(a % 60).padStart(2, '0')}`; };
  const text = (s) => String(s).replace(/[\;,]/g, (c) => `\\${c}`).replace(/\n/g, '\\n');
  const foldLine = (line) => {
    const out = [];
    let cur = '';
    for (const ch of line) {
      if (new TextEncoder().encode(cur + ch).length > (out.length ? 74 : 75)) { out.push(cur); cur = ''; }
      cur += ch;
    }
    return [...out, cur].join('\r\n ');
  };
  const ev = room.event || {}, end = l.slot + (l.len || HOUR);
  const mapLink = p ? (base === 'google' ? gmapsUrl(p) : osmUrl(p)) : '';
  const lines = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Huddle//Huddle//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    // The zone's offset at the event (zones that change offset are approximated by that one offset).
    'BEGIN:VTIMEZONE', `TZID:${myTz}`, 'BEGIN:STANDARD', 'DTSTART:19700101T000000', `TZOFFSETFROM:${off(l.slot)}`, `TZOFFSETTO:${off(l.slot)}`, 'END:STANDARD', 'END:VTIMEZONE',
    'BEGIN:VEVENT',
    `UID:${roomId}-${l.slot}@huddle`,
    `DTSTAMP:${stamp(Date.now())}`,
    `DTSTART;TZID=${myTz}:${wall(l.slot)}`,
    `DTEND;TZID=${myTz}:${wall(end)}`,
    `SUMMARY:${text(ev.title || (p?.label ? `Huddle at ${p.label}` : 'Huddle'))}`,
    ...(p ? [`LOCATION:${text(mapLink)}`, `GEO:${p.lat.toFixed(6)};${p.lng.toFixed(6)}`] : []),
    `DESCRIPTION:${text([p && `Place: #${p.n}${p.label ? ` ${p.label}` : ''}`, `Room: ${shareUrl().href}`].filter(Boolean).join('\n'))}`,
    `URL:${shareUrl().href}`,
    'END:VEVENT', 'END:VCALENDAR',
  ];
  const a = el('a', { href: URL.createObjectURL(new Blob([lines.map(foldLine).join('\r\n') + '\r\n'], { type: 'text/calendar' })), download: 'huddle.ics' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- boot ---------- */

fetch('/api/info').then((r) => r.json()).then((i) => { serverInfo = i; }).catch(() => {});
syncMarkers();
renderList();
renderRoom();
connect(hash.room || roomCode(), hash.room ? null : hash.area);   // no room in the link: a new one
// Back to the view (Space or Time) and, in the stacked layouts, the tab that were open.
{
  const s = store.get(K.tab, null);
  if (s?.view === 'time' || s?.view === 'space') setView(s.view);
  if (tabMQ.matches && ['pins', 'time', 'chat'].includes(s?.tab)) setTab(s.tab);
}
updateUrl();
if (store.get(K.tut, false)) locate(); else tutorial(locate);   // ask for location after the tutorial, not over it
